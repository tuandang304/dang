[project]
name = "dang"
version = "0.1.0"
description = "AdaPolyp: adapting a frozen vision foundation model for generalizable polyp segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.23.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8,<5",
    "pillow>=10.0.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
    "timm>=1.0.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dang"]
